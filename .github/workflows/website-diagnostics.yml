name: Website anchor diagnostics (temporary)

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-diagnostics.yml'

concurrency:
  group: website-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anchors:
    runs-on: macos-26
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run build
      - name: Reproduce the original unclamped assertion
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          test_file = Path("tests/site.spec.js")
          source = test_file.read_text()
          source = source.replace("Math.abs(y - expectedY) <= 2", "Math.abs(lastSample.top - lastSample.padding) <= 2")
          start = source.index("      // A tall desktop window")
          end = source.index("    });", start)
          test_file.write_text(source[:start] + source[end:])
          PYTHON
      - name: Original native anchor clicks, EN and ES
        env:
          ALTILLO_ANCHOR_DIAGNOSTICS: '1'
        run: npm test -- --project=safari --grep='navigation links go where they say' --workers=1 --retries=0 --repeat-each=2 --trace=retain-on-failure --fail-on-flaky-tests --forbid-only
      - name: Retain diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-anchor-diagnostics
          path: |
            website/playwright-report
            website/test-results
