name: Release

# Tag a version to ship it: `git tag v0.2.0 && git push origin v0.2.0`. This workflow builds, signs,
# notarizes, and packages Altillo, then publishes the GitHub release and the Sparkle appcast
# (script/release.sh handles all of that — this workflow just provides credentials and calls it).
# One-time setup (secrets, GitHub Pages) is documented in docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  actions: read # release.sh verifies the exact source commit's CI run before publishing

# Serialize releases: each run reads appcast.xml from gh-pages, regenerates it, and pushes the branch.
# Without this, two tags pushed close together could race and drop a feed entry.
concurrency:
  group: release-appcast
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  quality:
    name: Swift, macOS, and localization gates
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Select Xcode
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${latest:-/Applications/Xcode.app}"
      - name: Install XcodeGen
        run: brew install xcodegen
      # These suites share a global altillo-hook socket, so keep them serial.
      - name: AltilloKit tests
        working-directory: Packages/AltilloKit
        run: swift test
      - name: macOS build and tests
        run: |
          xcodegen generate
          xcodebuild -project Altillo.xcodeproj -scheme Altillo \
            -derivedDataPath build/dd-release-gate test
      - name: Check Spanish localization
        run: script/check-localization.py build/dd-release-gate

  website:
    name: Website gate
    runs-on: macos-26
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run build
      - run: npm test -- --workers=1 --fail-on-flaky-tests --forbid-only
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-playwright-report
          path: website/playwright-report
          if-no-files-found: ignore

  release:
    # Opt-in: tag pushes only build here once the secrets exist and the repository variable
    # ALTILLO_CI_RELEASE is "true" (docs/release.md). Until then releases are published locally with
    # `script/release.sh <version> --publish`, whose tag must not start a second, secret-less run.
    needs: [quality, website]
    # Manual dispatch uses the same opt-in and gates as tag pushes; it cannot bypass them.
    if: vars.ALTILLO_CI_RELEASE == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Build the requested tag. On a tag push `inputs.tag` is empty and checkout defaults to the
          # triggering tag; on workflow_dispatch this pins the tag instead of the default branch.
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # full history so CURRENT_PROJECT_VERSION (commit count) is correct

      - name: Select Xcode
        run: |
          set -euo pipefail
          latest=$(find /Applications -maxdepth 1 -name "Xcode_26*.app" 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${latest:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Install release tools
        run: brew install xcodegen create-dmg

      - name: Resolve tag and version
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      # Imports the Developer ID Application cert into a temporary keychain and adds it to the search
      # list (cleaned up automatically in a post step). script/release.sh finds it by team ID.
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.ALTILLO_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.ALTILLO_CERTIFICATE_PASSWORD }}

      # script/release.sh reads team/bundle/signing config from Config/Local.xcconfig, same as a local
      # dev build — CI writes the one values file that isn't a secret by itself (the actual signing
      # material comes from the imported certificate and the notary/Sparkle secrets below).
      - name: Write Config/Local.xcconfig
        run: |
          cat > Config/Local.xcconfig <<'EOF'
          ALTILLO_TEAM = 9L2TD7KVV9
          ALTILLO_BUNDLE_PREFIX = me.badia.altillo
          ALTILLO_MAC_SIGN_IDENTITY = Developer ID Application
          EOF

      - name: Build, sign, notarize, package, and publish
        env:
          ALTILLO_NOTARY_APPLE_ID: ${{ secrets.ALTILLO_NOTARY_APPLE_ID }}
          ALTILLO_NOTARY_APP_PASSWORD: ${{ secrets.ALTILLO_NOTARY_APP_PASSWORD }}
          ALTILLO_NOTARY_TEAM_ID: ${{ secrets.ALTILLO_NOTARY_TEAM_ID }}
          ALTILLO_SPARKLE_PUBLIC_KEY: ${{ secrets.ALTILLO_SPARKLE_PUBLIC_KEY }}
          ALTILLO_SPARKLE_PRIVATE_KEY: ${{ secrets.ALTILLO_SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: script/release.sh "${{ steps.meta.outputs.version }}" --publish
